<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meooow Scratch</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
#stage{
  position:fixed;
  inset:0;
}
#mainVisual,#scratchCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
#mainVisual{
  object-fit:cover;
  object-position:center;
  z-index:1;
  pointer-events:none;
}
#scratchCanvas{
  z-index:2;
  transition:opacity .45s ease;
}
#scratchCanvas.fade{
  opacity:0;
}
#hint{
  position:fixed;
  left:50%;
  bottom:10%;
  transform:translateX(-50%);
  z-index:3;
  padding:10px 20px;
  border-radius:999px;
  background:rgba(0,0,0,.45);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
  font-size:18px;
  pointer-events:none;
  transition:opacity .25s ease;
  white-space:nowrap;
}
#imageLink{
  position:fixed;
  left:50%;
  bottom:10%;
  transform:translateX(-50%);
  z-index:4;
  display:none;
  padding:10px 20px;
  border-radius:999px;
  background:rgba(0,0,0,.72);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
  font-size:18px;
  line-height:1.4;
  text-decoration:none;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
}
#error{
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  align-items:center;
  justify-content:center;
  padding:32px;
  box-sizing:border-box;
  background:#111;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
  font-size:20px;
  line-height:1.7;
  text-align:center;
}
</style>
</head>

<body>
<div id="stage">
  <img id="mainVisual" alt="主視覺">
  <canvas id="scratchCanvas"></canvas>
</div>

<div id="hint">動動手指 刮刮喵</div>
<a id="imageLink" href="#" target="_blank" rel="noopener noreferrer">查看更多喵喵</a>
<div id="error"></div>

<script>
const CONFIG = {
  // 每張圖可以對應自己的網址與按鈕文字
  mainImages: [
    {
      image: "main-visual-01.jpg",
      url: "https://www.google.com/search?q=angry+cat&sca_esv=0d90d5c973b1aedc&udm=2&biw=1728&bih=907&sxsrf=APpeQntV_L3iP5y7oCauSWOt0v5IblXbJw%3A1783587890684&ei=MmRPaqGlKcSavr0PocL6wA0&ved=0ahUKEwihhpnVnsWVAxVEja8BHSGhHtgQ4dUDCBE&uact=5&oq=angry+cat&gs_lp=Egtnd3Mtd2l6LWltZyIJYW5ncnkgY2F0MgUQABiABDIFEAAYgAQyBhAAGAcYHjIGEAAYBxgeMgYQABgHGB4yBhAAGAcYHjIGEAAYBxgeMgYQABgHGB4yBhAAGAcYHjIFEAAYgARI8hNQkApYuRFwAngAkAEAmAFhoAGqAqoBATW4AQPIAQD4AQGYAgegAsACwgIHEAAYgAQYCsICCBAAGAcYHhgTmAMAiAYBkgcBN6AHhQyyBwE1uAe8AsIHBTAuNi4xyAcOgAgB&sclient=gws-wiz-img",
      text: "查看更多森七喵喵"
    },
    {
      image: "main-visual-02.jpg",
      url: "https://www.google.com/search?sa=X&sca_esv=0d90d5c973b1aedc&sxsrf=APpeQnsz5xwqJbzA7kRKqj0iq9uVNyD3DQ:1783587589846&udm=2&fbs=ABfTbFUhNGvvPEUFOvrsPMHwBXgOf1BDPCnJA7T66GFBo7wwhM5svZTbwL96qcNqo9o8OSTgVdu2kShqMetZh8UXJ3eqR2xXwXFJt3widcm6GNMm3Qlzcxyd7fJZEL1pT3l_ZSA5mwLbfHoOVJ0hETILqyub_tmqI024nYw1JEyln4JNwSniqB3mH-eW5esZOynyLIdYkTY-&q=cute+cat&ved=2ahUKEwj-o9_FncWVAxXNQPUHHXPaI8QQtKgLegQIEBAB&biw=1728&bih=907&dpr=2",
      text: "查看更多可愛喵喵"
    },
    {
      image: "main-visual-03.jpg",
      url: "https://www.google.com/search?q=calm+cat&sca_esv=0d90d5c973b1aedc&udm=2&biw=1728&bih=907&sxsrf=APpeQnszS_gii5M0-h4h0WYpda8T-ud7ow%3A1783587938309&ei=YmRPatC0Esucvr0Pg-3gqAo&ved=0ahUKEwjQ7fPrnsWVAxVLjq8BHYM2GKUQ4dUDCBE&uact=5&oq=calm+cat&gs_lp=Egtnd3Mtd2l6LWltZyIIY2FsbSBjYXQyBhAAGAcYHjIGEAAYBxgeMgYQABgHGB4yBhAAGAcYHjIGEAAYBxgeMgYQABgHGB4yBhAAGAcYHjIGEAAYBxgeMgYQABgHGB4yCBAAGAcYHhgKSJoJUABY8AZwAHgAkAEAmAEtoAGeAaoBATS4AQPIAQD4AQGYAgSgAq0BwgIFEAAYgASYAwCSBwE0oAe2CbIHATS4B60BwgcDMC40yAcIgAgB&sclient=gws-wiz-img",
      text: "查看更多放鬆喵喵"
    }
  ],

  silverImage: "silver.png",

  mobileWidth: 768,
  mobileBrushRadius: 20,
  desktopBrushHeightRatio: 0.04,

  idleResetTime: 20 * 1000,
  resetFadeTime: 450,

  // true：刮開後顯示連結；false：一開始就顯示連結
  showLinkAfterScratch: true
};

const canvas = document.getElementById("scratchCanvas");
const ctx = canvas.getContext("2d");
const mainVisual = document.getElementById("mainVisual");
const hint = document.getElementById("hint");
const imageLink = document.getElementById("imageLink");
const errorBox = document.getElementById("error");

const silver = new Image();

let drawing = false;
let hasScratched = false;
let lastX = null;
let lastY = null;
let timer = null;
let currentItem = null;
let lastItem = null;

let imageQueue = [];

function showError(message) {
  errorBox.innerHTML = message;
  errorBox.style.display = "flex";
}

function shuffle(array) {
  const result = array.slice();
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function getNextItem() {
  if (imageQueue.length === 0) {
    imageQueue = shuffle(CONFIG.mainImages);

    if (
      lastItem &&
      imageQueue.length > 1 &&
      imageQueue[0].image === lastItem.image
    ) {
      const swapIndex = 1 + Math.floor(Math.random() * (imageQueue.length - 1));
      [imageQueue[0], imageQueue[swapIndex]] = [imageQueue[swapIndex], imageQueue[0]];
    }
  }

  const next = imageQueue.shift();
  lastItem = next;
  return next;
}

function setRandomMainImage() {
  currentItem = getNextItem();

  mainVisual.src = currentItem.image;

  imageLink.href = currentItem.url || "#";
  imageLink.textContent = currentItem.text || "查看更多喵喵";

  if (CONFIG.showLinkAfterScratch) {
    imageLink.style.display = "none";
  } else {
    imageLink.style.display = currentItem.url ? "block" : "none";
  }

  hasScratched = false;
}

function brushRadius() {
  return window.innerWidth < CONFIG.mobileWidth
    ? CONFIG.mobileBrushRadius
    : window.innerHeight * CONFIG.desktopBrushHeightRatio;
}

function fitSilver(img) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const ir = img.naturalWidth / img.naturalHeight;
  const cr = w / h;

  let dw, dh, dx, dy;

  if (ir > cr) {
    dh = h;
    dw = img.naturalWidth * h / img.naturalHeight;
    dx = (w - dw) / 2;
    dy = 0;
  } else {
    dw = w;
    dh = img.naturalHeight * w / img.naturalWidth;
    dx = 0;
    dy = (h - dh) / 2;
  }

  ctx.drawImage(img, dx, dy, dw, dh);
}

function drawSilver() {
  if (!silver.complete || silver.naturalWidth === 0) return;

  const dpr = window.devicePixelRatio || 1;
  const width = window.innerWidth;
  const height = window.innerHeight;

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, width, height);

  fitSilver(silver);

  canvas.classList.remove("fade");
  hint.style.opacity = 1;
}

function pos(e) {
  const r = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;

  return {
    x: p.clientX - r.left,
    y: p.clientY - r.top
  };
}

function showCurrentLink() {
  if (!currentItem || !currentItem.url) return;
  imageLink.style.display = "block";
}

function eraseLine(x, y) {
  const radius = brushRadius();

  ctx.globalCompositeOperation = "destination-out";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = radius * 2;

  if (lastX === null || lastY === null) {
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  } else {
    const dx = x - lastX;
    const dy = y - lastY;
    const dist = Math.hypot(dx, dy);
    const step = Math.max(radius * 0.35, 2);
    const n = Math.max(Math.ceil(dist / step), 1);

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);

    for (let i = 1; i <= n; i++) {
      const t = i / n;
      ctx.lineTo(lastX + dx * t, lastY + dy * t);
    }

    ctx.stroke();
  }

  lastX = x;
  lastY = y;

  hint.style.opacity = 0;

  if (!hasScratched) {
    hasScratched = true;
    if (CONFIG.showLinkAfterScratch) {
      showCurrentLink();
    }
  }
}

function start(e) {
  e.preventDefault();

  // 如果使用者點到連結，交給連結本身處理
  if (e.target === imageLink) return;

  drawing = true;

  const p = pos(e);
  lastX = p.x;
  lastY = p.y;

  eraseLine(p.x, p.y);
  resetTimer();
}

function move(e) {
  if (!drawing) return;
  e.preventDefault();

  const p = pos(e);
  eraseLine(p.x, p.y);
  resetTimer();
}

function end() {
  drawing = false;
  lastX = null;
  lastY = null;
}

function resetScratchCard() {
  canvas.classList.add("fade");

  setTimeout(() => {
    setRandomMainImage();
    drawSilver();
    resetTimer();
  }, CONFIG.resetFadeTime);
}

function resetTimer() {
  clearTimeout(timer);
  timer = setTimeout(resetScratchCard, CONFIG.idleResetTime);
}

mainVisual.onerror = () => {
  showError(
    "底圖載入失敗。<br>" +
    "請確認 CONFIG.mainImages 內的 image 檔名與資料夾中的圖片完全一致。<br>" +
    "目前嘗試載入：" + (currentItem ? currentItem.image : "")
  );
};

silver.onload = () => {
  setRandomMainImage();
  drawSilver();
  resetTimer();
};

silver.onerror = () => {
  showError(
    "找不到 silver.png。<br>" +
    "此版本只使用 silver.png 作為表層銀膜，請確認檔名與位置。"
  );
};

silver.src = CONFIG.silverImage;

window.addEventListener("resize", drawSilver);

canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", move);
canvas.addEventListener("mouseup", end);
canvas.addEventListener("mouseleave", end);

canvas.addEventListener("touchstart", start, { passive:false });
canvas.addEventListener("touchmove", move, { passive:false });
canvas.addEventListener("touchend", end);
canvas.addEventListener("touchcancel", end);
</script>
</body>
</html>
