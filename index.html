<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meooow Scratch</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0}
#mainVisual,#scratchCanvas{position:absolute;inset:0;width:100%;height:100%}
#mainVisual{object-fit:cover;z-index:1;pointer-events:none}
#scratchCanvas{z-index:2;transition:opacity .45s}
#scratchCanvas.fade{opacity:0}
#hint{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);z-index:3;padding:10px 20px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff}
</style>
</head>
<body>
<div id="stage">
<img id="mainVisual" src="main-visual.jpg">
<canvas id="scratchCanvas"></canvas>
</div>
<div id="hint">動動手指 刮刮看・ω・</div>
<script>
const CONFIG={
 mobileWidth:768,
 mobileBrushRadius:20,
 desktopBrushHeightRatio:0.04,
 idleResetTime:60000,
 resetFadeTime:0,
 silverImage:"silver.png"
};

const canvas=document.getElementById("scratchCanvas");
const ctx=canvas.getContext("2d");
const hint=document.getElementById("hint");
const silver=new Image();

let drawing=false,lastX=null,lastY=null,timer=null;

function brushRadius(){
 return window.innerWidth<CONFIG.mobileWidth?
 CONFIG.mobileBrushRadius:
 window.innerHeight*CONFIG.desktopBrushHeightRatio;
}

function fit(img){
 const w=window.innerWidth,h=window.innerHeight;
 const ir=img.naturalWidth/img.naturalHeight;
 const cr=w/h;
 let dw,dh,dx,dy;
 if(ir>cr){dh=h;dw=img.naturalWidth*h/img.naturalHeight;dx=(w-dw)/2;dy=0;}
 else{dw=w;dh=img.naturalHeight*w/img.naturalWidth;dx=0;dy=(h-dh)/2;}
 ctx.drawImage(img,dx,dy,dw,dh);
}

function drawSilver(){
 const dpr=window.devicePixelRatio||1;
 canvas.width=window.innerWidth*dpr;
 canvas.height=window.innerHeight*dpr;
 canvas.style.width=window.innerWidth+"px";
 canvas.style.height=window.innerHeight+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
 fit(silver);
 hint.style.opacity=1;
 canvas.classList.remove("fade");
}

function pos(e){
 const r=canvas.getBoundingClientRect();
 const p=e.touches?e.touches[0]:e;
 return {x:p.clientX-r.left,y:p.clientY-r.top};
}

function eraseLine(x,y){
 const radius=brushRadius();
 ctx.globalCompositeOperation="destination-out";
 ctx.lineCap="round";
 ctx.lineJoin="round";
 ctx.lineWidth=radius*2;

 if(lastX===null){
   ctx.beginPath();
   ctx.arc(x,y,radius,0,Math.PI*2);
   ctx.fill();
 }else{
   const dx=x-lastX,dy=y-lastY;
   const dist=Math.hypot(dx,dy);
   const step=Math.max(radius*0.35,2);
   const n=Math.max(Math.ceil(dist/step),1);

   ctx.beginPath();
   ctx.moveTo(lastX,lastY);
   for(let i=1;i<=n;i++){
      const t=i/n;
      ctx.lineTo(lastX+dx*t,lastY+dy*t);
   }
   ctx.stroke();
 }
 lastX=x;lastY=y;
 hint.style.opacity=0;
}

function start(e){
 e.preventDefault();
 drawing=true;
 const p=pos(e);
 lastX=p.x;lastY=p.y;
 eraseLine(p.x,p.y);
 resetTimer();
}
function move(e){
 if(!drawing)return;
 e.preventDefault();
 const p=pos(e);
 eraseLine(p.x,p.y);
 resetTimer();
}
function end(){
 drawing=false;
 lastX=null;lastY=null;
}
function resetTimer(){
 clearTimeout(timer);
 timer=setTimeout(()=>{
   canvas.classList.add("fade");
   setTimeout(drawSilver,CONFIG.resetFadeTime);
 },CONFIG.idleResetTime);
}

silver.onload=()=>{drawSilver();resetTimer();}
silver.onerror=()=>alert("找不到 silver.png，V7 已移除程式生成銀膜，請提供 silver.png。");
silver.src=CONFIG.silverImage;

window.addEventListener("resize",drawSilver);

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",move);
canvas.addEventListener("mouseup",end);
canvas.addEventListener("mouseleave",end);

canvas.addEventListener("touchstart",start,{passive:false});
canvas.addEventListener("touchmove",move,{passive:false});
canvas.addEventListener("touchend",end);
canvas.addEventListener("touchcancel",end);
</script>
</body>
</html>
